<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master your skills</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="setup" class="setup">
    <div class="setup-card">
      <h1>Master your skills</h1>
      <p class="tagline">A team pose-matching trial powered by on-device AI.<br/>
        Your camera never leaves this page.</p>

      <label class="field">
        <span>Adventurers</span>
        <select id="participants">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>

      <label class="field">
        <span>Camera</span>
        <select id="cameraSelect">
          <option value="">Default camera</option>
        </select>
      </label>

      <details class="advanced">
        <summary>Advanced (for testing)</summary>
        <label class="field">
          <span>Start at round</span>
          <select id="startRound">
            <option value="1" selected>1 (A-D)</option>
            <option value="2">2 (E-H)</option>
            <option value="3">3 (Mystery)</option>
          </select>
        </label>
        <label class="field checkbox">
          <input type="checkbox" id="devMode" />
          <span>Dev mode: cycle poses A-H in order</span>
        </label>
      </details>

      <button id="startBtn">Start the trial</button>
      <p id="setupStatus" class="status"></p>
    </div>
  </div>

  <div id="stage" class="stage hidden">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="camWarning" class="cam-warning hidden"></div>
    <div class="toolbar">
      <button id="infoBtn" title="How to play (I)">How to play</button>
      <button id="hintBtn" title="Hint trace (H)">Hint</button>
      <button id="newCodeBtn" title="New code (R)">New code</button>
      <button id="exitBtn" title="Back to setup">Exit</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
